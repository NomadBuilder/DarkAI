name: Un-Default
description: Scan repo files for inclusive-language defaults; fail the job or upload SARIF.
author: NomadBuilder
branding:
  icon: check-circle
  color: green

inputs:
  paths:
    description: Paths to scan (space-separated)
    required: false
    default: "."
  fail-on:
    description: "any | hard | never — when to fail the job"
    required: false
    default: "hard"
  format:
    description: "text | json | sarif"
    required: false
    default: "json"
  output-file:
    description: Where to write machine-readable output
    required: false
    default: "un-default-report.json"
  ignore-file:
    description: Optional path to .undefaultignore
    required: false
    default: ""
  comment-on-pr:
    description: If true, post a checklist comment on pull_request events
    required: false
    default: "true"
  changed-from:
    description: Optional git branch or SHA; scan only files changed since it
    required: false
    default: ""
  telemetry:
    description: "If true, send an anonymous action_run ping (no repo name or findings)"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Run Un-Default
      id: scan
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        SCAN_PATHS: ${{ inputs.paths }}
        FAIL_ON: ${{ inputs.fail-on }}
        FORMAT: ${{ inputs.format }}
        OUT_FILE: ${{ inputs.output-file }}
        IGNORE_FILE: ${{ inputs.ignore-file }}
        CHANGED_FROM: ${{ inputs.changed-from }}
      run: |
        set +e
        IGNORE_ARGS=()
        CHANGED_ARGS=()
        read -r -a PATH_ARGS <<< "$SCAN_PATHS"
        if [ -n "$IGNORE_FILE" ]; then
          IGNORE_ARGS+=(--ignore-file "$IGNORE_FILE")
        elif [ -f .undefaultignore ]; then
          IGNORE_ARGS+=(--ignore-file .undefaultignore)
        fi
        if [ -n "$CHANGED_FROM" ]; then
          CHANGED_ARGS+=(--changed-from "$CHANGED_FROM")
        fi
        node "$ACTION_PATH/dist/cli.cjs" "${PATH_ARGS[@]}" \
          --format "$FORMAT" \
          --fail-on "$FAIL_ON" \
          --out "$OUT_FILE" \
          "${IGNORE_ARGS[@]}" \
          "${CHANGED_ARGS[@]}"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Anonymous usage ping
      if: inputs.telemetry == 'true'
      continue-on-error: true
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        curl -fsS -m 8 -X POST "https://darkai.ca/un-default/api/telemetry" \
          -H "content-type: application/json" \
          -d "{\"event\":\"action_run\",\"source\":\"github-action\",\"ref\":\"${ACTION_REF}\"}" \
          >/dev/null || true

    - name: Upload SARIF
      if: inputs.format == 'sarif' && hashFiles(inputs.output-file) != ''
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: ${{ inputs.output-file }}

    - name: PR checklist comment
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      continue-on-error: true
      with:
        script: |
          const fs = require('fs');
          const out = '${{ inputs.output-file }}';
          const format = '${{ inputs.format }}';
          let body = '## Un-Default\n\n';
          try {
            if (format === 'json' && fs.existsSync(out)) {
              const report = JSON.parse(fs.readFileSync(out, 'utf8'));
              body += `Findings: **${report.summary.total}** (${report.summary.hard} hard · ${report.summary.soft} soft)\n\n`;
              for (const f of (report.findings || []).slice(0, 40)) {
                const soft = f.likelyFalsePositive ? ' _(soft)_' : '';
                const tryOne = (f.suggestions && f.suggestions[0]) || 'rephrase';
                body += `- [ ] **${f.label}** — “${f.match}” → ${tryOne}${soft}\n`;
              }
              if ((report.findings || []).length > 40) {
                body += `\n_…and ${report.findings.length - 40} more._\n`;
              }
              if (!report.findings?.length) {
                body += '_No phrases to reconsider in scanned paths._\n';
              }
            } else if (format === 'sarif' && fs.existsSync(out)) {
              body += `SARIF written to \`${out}\`. Exit code: \`${{ steps.scan.outputs.exit_code }}\`\n`;
            } else {
              body += `Scan finished (format: \`${format}\`). Exit code: \`${{ steps.scan.outputs.exit_code }}\`\n`;
            }
          } catch (e) {
            body += `Could not parse report: ${e.message}\n`;
          }
          body += `\n— [Un-Default](https://github.com/NomadBuilder/anti-default) · [Try the web app](https://darkai.ca/un-default)\n`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes('## Un-Default'));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Fail if findings matched --fail-on
      if: steps.scan.outputs.exit_code != '0'
      shell: bash
      run: exit ${{ steps.scan.outputs.exit_code }}
