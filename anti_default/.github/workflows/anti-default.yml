name: Anti-Default self-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan this repo
        uses: ./
        with:
          paths: "src scripts README.md"
          fail-on: never
          format: json
          output-file: anti-default-report.json
          comment-on-pr: "true"
