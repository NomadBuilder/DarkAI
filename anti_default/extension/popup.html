<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Anti-Default</title>
    <style>
      body {
        margin: 0;
        min-width: 240px;
        font: 14px/1.4 system-ui, sans-serif;
        color: #1a2e28;
        background: #f4f0e8;
        padding: 14px;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 8px;
        font-weight: 600;
      }
      p {
        margin: 0 0 12px;
        color: #4a5c55;
        font-size: 12px;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      a {
        color: #1d6b56;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Anti-Default</h1>
    <p>Highlight inclusive-language suggestions on this page.</p>
    <label>
      <input type="checkbox" id="enabled" checked />
      Highlights on
    </label>
    <p>
      <a href="https://darkai.ca/anti-default/" target="_blank" rel="noopener"
        >Full reviewer on darkai.ca</a
      >
    </p>
    <script src="popup.js"></script>
  </body>
</html>
