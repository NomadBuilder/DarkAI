<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Anti-Default</title>
    <style>
      :root {
        --ink: #1a1f2e;
        --ink-soft: #3d4558;
        --paper: #f6f1e8;
        --teal: #1a524a;
        --coral: #c45c4a;
        --warn: #9a6b12;
        --line: color-mix(in srgb, #1a1f2e 14%, transparent);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 360px;
        max-height: 520px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        font: 13px/1.45 system-ui, -apple-system, sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      header {
        padding: 14px 14px 10px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      h1 {
        font-size: 1.05rem;
        margin: 0 0 4px;
        font-weight: 650;
      }
      .meta {
        margin: 0;
        color: var(--ink-soft);
        font-size: 12px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--line);
        background: white;
        color: var(--ink);
        padding: 6px 10px;
        border-radius: 4px;
      }
      button:hover {
        border-color: var(--teal);
      }
      button.primary {
        background: var(--teal);
        border-color: var(--teal);
        color: var(--paper);
      }
      #status {
        padding: 20px 14px;
        color: var(--ink-soft);
        font-size: 12px;
      }
      #list {
        margin: 0;
        padding: 0;
        list-style: none;
        overflow: auto;
        flex: 1;
      }
      .finding {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .finding:hover,
      .finding:focus-within {
        background: color-mix(in srgb, #1a524a 6%, transparent);
      }
      .label {
        font-weight: 600;
        margin: 0 0 4px;
        font-size: 13px;
      }
      .match {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        margin: 0 0 6px;
      }
      .why,
      .try,
      .context,
      .note {
        margin: 0 0 4px;
        color: var(--ink-soft);
        font-size: 12px;
      }
      .note {
        color: var(--warn);
        margin-top: 6px;
      }
      .try strong,
      .context strong {
        color: var(--ink);
        font-weight: 600;
      }
      footer {
        flex-shrink: 0;
        padding: 8px 14px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--ink-soft);
      }
      footer a {
        color: var(--teal);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Anti-Default</h1>
      <p class="meta" id="summary">Scanning this page…</p>
      <div class="actions">
        <button type="button" class="primary" id="rescan">Re-scan page</button>
      </div>
    </header>
    <div id="status" hidden></div>
    <ul id="list"></ul>
    <footer>
      Matching stays on your device.
      <a href="https://darkai.ca/anti-default/privacy/" target="_blank" rel="noopener"
        >Privacy</a
      >
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
