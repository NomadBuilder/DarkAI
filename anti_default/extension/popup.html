<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Anti-Default</title>
    <style>
      body {
        margin: 0;
        min-width: 260px;
        font: 14px/1.45 system-ui, -apple-system, sans-serif;
        color: #1a1f2e;
        background: #f6f1e8;
        padding: 16px;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 6px;
        font-weight: 650;
      }
      p {
        margin: 0 0 12px;
        color: #3d4558;
        font-size: 12px;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
        font-size: 13px;
      }
      a {
        color: #1a524a;
        font-size: 12px;
      }
      .links {
        display: grid;
        gap: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Anti-Default</h1>
    <p>Highlight inclusive-language suggestions on this page. Matching stays on your device.</p>
    <label>
      <input type="checkbox" id="enabled" checked />
      Highlights on
    </label>
    <div class="links">
      <a href="https://darkai.ca/anti-default/" target="_blank" rel="noopener"
        >Full reviewer</a
      >
      <a
        href="https://darkai.ca/anti-default/privacy/"
        target="_blank"
        rel="noopener"
        >Privacy</a
      >
    </div>
    <script src="popup.js"></script>
  </body>
</html>
